name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install backend dependencies
        run: |
          cd todobackend
          npm install

      - name: Install frontend dependencies
        run: |
          cd todofrontend
          npm install

      - name: Build frontend
        run: |
          cd todofrontend
          npm run build

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: |
          cd todobackend
          docker build -t watsonlimprevil/todobackend:latest .

      - name: Build frontend image
        run: |
          cd todofrontend
          docker build -t watsonlimprevil/todofrontend:latest .

      - name: Push backend image
        run: |
          docker push watsonlimprevil/todobackend:latest

      - name: Push frontend image
        run: |
          docker push watsonlimprevil/todofrontend:latest
