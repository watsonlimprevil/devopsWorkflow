name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install backend dependencies
        run: |
          cd todobackend
          npm install

      - name: Build backend
        run: |
          cd todobackend
          npm run build

      - name: Install frontend dependencies
        run: |
          cd todofrontend
          npm install

      - name: Build frontend
        run: |
          cd todofrontend
          npm run build



